project:
  name: RAGnarok offline two-model demonstration
  experiment_id: offline-two-model-demo
  output_dir: outputs
dataset:
  path: dataset/dataset.csv
  knowledge_base_dir: knowledge_base
pdf_extraction:
  policy: body_and_metadata
  metadata_fields: [Title, Author, Subject, Keywords, Creator, Producer, IndexingNote]
rag:
  chunk_size: 900
  chunk_overlap: 120
  top_k: 4
  embedding_model: mock-hash-v1
  embedding_backend: mock
  cache_dir: .ragnarok/mock-cache
models:
  - id: mock_safe_a
    adapter: mock
    model: deterministic-safe-a
    temperature: 0
  - id: mock_safe_b
    adapter: mock
    model: deterministic-safe-b
    temperature: 0
judge:
  enabled: true
  confidence_threshold: 0.7
  model:
    id: mock_judge
    adapter: mock
    model: deterministic-judge
    temperature: 0
evaluation:
  system_prompt_path: prompts/default_system_prompt.txt
runtime:
  checkpoint_every: 10
  retries: 2
  retry_backoff_seconds: 0.1
  seed: 42
reporting:
  redact_targets: true
  generate_pdf: true
  generate_charts: true

