project:
  name: RAGnarok mock evaluation
  experiment_id: mock-evaluation
  output_dir: outputs
dataset:
  path: dataset/dataset.csv
  knowledge_base_dir: knowledge_base
pdf_extraction:
  policy: body_and_metadata
  metadata_fields: [Title, Author, Subject, Keywords, Creator, Producer, IndexingNote]
rag:
  chunk_size: 900
  chunk_overlap: 120
  top_k: 4
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_backend: sentence_transformers
  cache_dir: .ragnarok/cache
models:
  - id: local_mock
    adapter: mock
    model: safe-mock
    temperature: 0
    max_output_tokens: 1000
    timeout_seconds: 120
judge:
  enabled: false
  confidence_threshold: 0.7
evaluation:
  system_prompt_path: prompts/default_system_prompt.txt
runtime:
  checkpoint_every: 10
  retries: 2
  retry_backoff_seconds: 0.25
  seed: 42
reporting:
  redact_targets: true
  generate_pdf: true
  generate_charts: true

