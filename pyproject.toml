[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnarok-eval"
version = "0.1.0"
description = "Local evaluation framework for the RAGnarok RAG security benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-4.0"}
dependencies = [
  "typer>=0.12",
  "questionary>=2.0",
  "keyring>=25.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "pypdf>=4.0",
  "rich>=13.7",
]

[project.scripts]
ragnarok = "ragnarok.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
